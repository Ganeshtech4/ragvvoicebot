services:
  postgres:
    image: postgres:15-alpine
    container_name: voice-rag-postgres
    environment:
      POSTGRES_DB: voice_rag_db
      POSTGRES_USER: voice_rag_user
      POSTGRES_PASSWORD: voice_rag_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - voice-rag-network

  redis:
    image: redis:7-alpine
    container_name: voice-rag-redis
    ports:
      - "6379:6379"
    networks:
      - voice-rag-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice-rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - voice-rag-network

  docubot-backend:
    build:
      context: .
      dockerfile: docubot-backend/Dockerfile
    container_name: voice-rag-docubot-backend
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql+asyncpg://voice_rag_user:voice_rag_password@postgres:5432/voice_rag_db
      - REDIS_URL=redis://redis:6379
      - CHATBOT_RAG_URL=http://chatbot-rag:5002
      - ENVIRONMENT=development
      - JWT_SECRET=super-secret-production-key-change-me
    ports:
      - "5001:5001"
    volumes:
      - ./docubot-backend:/app
      - ./shared:/app/shared
    depends_on:
      - postgres
      - redis
    networks:
      - voice-rag-network

  celery-worker:
    build:
      context: .
      dockerfile: docubot-backend/Dockerfile
    container_name: voice-rag-celery-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://voice_rag_user:voice_rag_password@postgres:5432/voice_rag_db
      - REDIS_URL=redis://redis:6379
      - CHATBOT_RAG_URL=http://chatbot-rag:5002
      - JWT_SECRET=super-secret-production-key-change-me
    volumes:
      - ./docubot-backend:/app
      - ./shared:/app/shared
    depends_on:
      - redis
      - postgres
      - qdrant
    networks:
      - voice-rag-network

  chatbot-rag:
    build:
      context: .
      dockerfile: chatbot-rag/Dockerfile
    container_name: voice-rag-chatbot-rag
    environment:
      - PORT=5002
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-mock}
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - STT_PROVIDER=${STT_PROVIDER:-mock}
      - STT_API_KEY=${STT_API_KEY:-mock}
      - STT_API_URL=${STT_API_URL:-}
      - STT_MODEL=${STT_MODEL:-}
      - TTS_PROVIDER=${TTS_PROVIDER:-mock}
      - TTS_API_KEY=${TTS_API_KEY:-mock}
      - TTS_API_URL=${TTS_API_URL:-}
      - TTS_MODEL=${TTS_MODEL:-}
      - TTS_VOICE=${TTS_VOICE:-}
      - DOCUBOT_BACKEND_URL=http://docubot-backend:5001
      - ENVIRONMENT=development
      - JWT_SECRET=super-secret-production-key-change-me
    ports:
      - "5002:5002"
    volumes:
      - ./chatbot-rag:/app
      - ./shared:/app/shared
      - ./benchmarks:/app/benchmarks
    depends_on:
      - qdrant
      - docubot-backend
    networks:
      - voice-rag-network

  frontend:
    build:
      context: ./docubot-frontend
      dockerfile: Dockerfile
    container_name: voice-rag-frontend
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=http://docubot-backend:5001
    volumes:
      - ./docubot-frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - voice-rag-network

  nginx:
    image: nginx:alpine
    container_name: voice-rag-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - chatbot-rag
      - docubot-backend
    networks:
      - voice-rag-network

volumes:
  pgdata:
  qdrant_data:

networks:
  voice-rag-network:
    driver: bridge
